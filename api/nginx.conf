# Nginx configuration for Success Media TV API
# Place this in your nginx server block

location /api/ {
    # If the file doesn't exist, route to index.php
    try_files $uri /api/index.php?$query_string;
}

location /api/index.php {
    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

# Database and generated secrets must never be served
location ^~ /api/data/ {
    deny all;
    return 404;
}

# Uploaded files are data only: never execute scripts from the images folder
location ~* ^/images/.*\.(php\d?|phtml|phar)$ {
    deny all;
    return 404;
}
