# Nginx configuration for Success Media TV
# Place this in your nginx server block (root = the site folder)

index index.php;

# Pages of the site (/article/…, /rubrique/…, /lives…) → index.php (SEO tags + application)
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# /index.html and /index.php → / (a single URL for the home page)
location = /index.html { return 301 /; }

location = /sitemap.xml {
    rewrite ^ /sitemap.php last;
}

location /api/ {
    # If the file doesn't exist, route to index.php
    try_files $uri /api/index.php?$query_string;
}

location ~ ^/(index|sitemap|api/index)\.php$ {
    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

# Database and generated secrets must never be served
location ^~ /api/data/ {
    deny all;
    return 404;
}

# Uploaded files are data only: never execute scripts from the images folder
location ~* ^/images/.*\.(php\d?|phtml|phar)$ {
    deny all;
    return 404;
}

# Browser cache for static files
location ~* \.(png|jpe?g|webp|svg|woff2)$ {
    expires 30d;
}

gzip on;
gzip_types text/css application/javascript application/json application/xml image/svg+xml;
